<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>하루 기록</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',sans-serif;background:#fff9fe;min-height:100vh;color:#333}
.app{max-width:420px;margin:0 auto;padding:12px}

.nav{display:flex;justify-content:space-around;background:#fff;border-radius:16px;padding:8px;margin-bottom:16px;box-shadow:0 2px 12px rgba(200,150,200,0.15)}
.nav-btn{border:none;background:transparent;padding:8px 12px;border-radius:12px;cursor:pointer;font-size:12px;color:#999;display:flex;flex-direction:column;align-items:center;gap:3px;transition:all .2s;line-height:1.3}
.nav-btn.active{background:#f3e8ff;color:#9333ea}
.nav-btn .nav-emoji{font-size:20px}

.cal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.cal-header h2{font-size:18px;font-weight:600;color:#7c3aed}
.cal-nav-btn{border:none;background:transparent;cursor:pointer;color:#9333ea;font-size:28px;padding:0 6px;border-radius:8px;line-height:1}
.cal-nav-btn:hover{background:#f3e8ff}
.cal-weekdays{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:4px}
.cal-wd{text-align:center;font-size:11px;color:#aaa;padding:4px 0;font-weight:600}
.cal-days{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal-day{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:12px;cursor:pointer;font-size:13px;font-weight:500;position:relative;border:none;background:transparent;transition:all .15s}
.cal-day:hover{background:#f3e8ff;color:#9333ea}
.cal-day.today{background:#9333ea;color:#fff!important}
.cal-day.selected{background:#f3e8ff;color:#9333ea;box-shadow:0 0 0 2px #c084fc}
.cal-day.other-month{color:#ccc}
.cal-day.has-note::after{content:'';width:4px;height:4px;background:#f472b6;border-radius:50%;position:absolute;bottom:3px}
.cal-day.today::after{background:#fff}
.score-dot{width:18px;height:4px;border-radius:2px;margin-top:1px;display:none}
.cal-day.has-score .score-dot{display:block}

.event-strip{margin:12px 0 6px;display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.event-chip{white-space:nowrap;background:#fdf2ff;border:1px solid #e9d5ff;border-radius:20px;padding:4px 10px;font-size:12px;color:#9333ea;cursor:pointer;flex-shrink:0}
.event-chip .ev-date{color:#c084fc;font-size:11px}

.day-detail{background:#fff;border-radius:16px;padding:16px;box-shadow:0 2px 16px rgba(180,100,200,.1);margin-top:8px}
.day-detail h3{font-size:16px;font-weight:600;color:#7c3aed;margin-bottom:12px}
.comment-box{width:100%;border:1.5px solid #e9d5ff;border-radius:10px;padding:10px 12px;font-size:14px;resize:none;height:64px;font-family:inherit;color:#333;background:#fdf9ff;outline:none;transition:border-color .2s}
.comment-box:focus{border-color:#9333ea}
.section-label{font-size:13px;font-weight:600;color:#9333ea;margin:14px 0 8px;display:flex;align-items:center;gap:6px}

.check-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;margin-bottom:6px;background:#faf7ff;border:1px solid #f0e6ff}
.check-name{flex:1;font-size:14px;color:#333}
.check-btns{display:flex;gap:4px}
.check-btn{width:34px;height:34px;border:1.5px solid #e9d5ff;border-radius:8px;background:transparent;cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;transition:all .15s;line-height:1}
.check-btn:hover{transform:scale(1.1)}
.check-btn.o.active{background:#d1fae5;border-color:#34d399}
.check-btn.t.active{background:#fef3c7;border-color:#fbbf24}
.check-btn.x.active{background:#ffe4e6;border-color:#fb7185}

.add-task{display:flex;gap:6px;margin-top:4px}
.add-task input{flex:1;border:1.5px solid #e9d5ff;border-radius:8px;padding:6px 10px;font-size:13px;outline:none;font-family:inherit}
.add-task input:focus{border-color:#9333ea}
.add-task button{background:#9333ea;color:#fff;border:none;border-radius:8px;padding:6px 12px;font-size:13px;cursor:pointer}

.save-btn{width:100%;background:#9333ea;color:#fff;border:none;border-radius:12px;padding:12px;font-size:15px;font-weight:600;cursor:pointer;margin-top:14px}
.save-btn:hover{opacity:.9}
.save-ok{text-align:center;font-size:13px;color:#9333ea;margin-top:8px;height:18px}

.event-form{background:#fff;border-radius:16px;padding:16px;box-shadow:0 2px 16px rgba(180,100,200,.1);margin-bottom:16px}
.ev-input{width:100%;border:1.5px solid #e9d5ff;border-radius:10px;padding:9px 12px;font-size:14px;margin-bottom:8px;outline:none;font-family:inherit}
.ev-input:focus{border-color:#9333ea}
.ev-add-btn{background:#9333ea;color:#fff;border:none;border-radius:10px;padding:9px 20px;font-size:14px;cursor:pointer;float:right}
.ev-list-item{display:flex;align-items:center;gap:10px;background:#fff;border-radius:12px;padding:10px 14px;margin-bottom:8px;box-shadow:0 1px 8px rgba(180,100,200,.1)}
.ev-emoji{font-size:20px}
.ev-info{flex:1}
.ev-title{font-size:14px;font-weight:600;color:#333}
.ev-date-txt{font-size:12px;color:#aaa}
.ev-del{border:none;background:transparent;cursor:pointer;color:#fca5a5;font-size:18px;padding:4px}

.stats-tabs{display:flex;gap:6px;margin-bottom:14px}
.stats-tab{flex:1;border:1.5px solid #e9d5ff;border-radius:10px;padding:7px;font-size:13px;font-weight:600;cursor:pointer;background:transparent;color:#9333ea;transition:all .2s}
.stats-tab.active{background:#9333ea;color:#fff;border-color:#9333ea}
.chart-wrap{background:#fff;border-radius:14px;padding:14px;box-shadow:0 2px 12px rgba(180,100,200,.1);margin-bottom:14px}
.chart-title{font-size:13px;font-weight:600;color:#9333ea;margin-bottom:12px}

/* 주간 세로 막대 */
.week-bars{display:flex;align-items:flex-end;gap:6px;height:160px;padding-bottom:24px;position:relative}
.week-bar-col{display:flex;flex-direction:column;align-items:center;flex:1;height:100%}
.week-bar-track{flex:1;width:100%;display:flex;align-items:flex-end;border-radius:6px 6px 0 0;overflow:visible;position:relative}
.week-bar-fill{width:100%;border-radius:6px 6px 0 0;background:linear-gradient(180deg,#c084fc,#ec4899);transition:height .4s;min-height:2px}
.week-bar-pct{font-size:10px;color:#9333ea;margin-top:2px;font-weight:600}
.week-bar-day{font-size:11px;color:#888;margin-top:4px}
.week-bar-today .week-bar-day{color:#9333ea;font-weight:700}

/* 월간 가로 막대 */
.bar-row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.bar-label{font-size:12px;color:#888;width:36px;text-align:right;flex-shrink:0}
.bar-track{flex:1;background:#f3e8ff;border-radius:4px;height:14px}
.bar-fill{height:100%;border-radius:4px;background:linear-gradient(90deg,#c084fc,#ec4899);transition:width .4s}
.bar-score{font-size:11px;color:#9333ea;width:28px;text-align:right;flex-shrink:0}

/* 월간 항목별 */
.task-score-item{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid #f3e8ff}
.task-score-item:last-child{border-bottom:none}
.ts-name{flex:1;font-size:13px;color:#333}
.ts-score{font-size:14px;font-weight:600;color:#9333ea}
.ts-max{font-size:11px;color:#ccc}

.empty{text-align:center;color:#ccc;font-size:13px;padding:24px 0}
</style>
</head>
<body>
<div class="app">
  <div style="text-align:center;padding:8px 0 4px">
    <span id="app-title" style="font-size:22px;font-weight:700;color:#9333ea" onclick="focusNameEdit()" title="설정에서 이름 변경">🌸 하루 기록</span>
  </div>

  <nav class="nav">
    <button class="nav-btn active" onclick="showPage('cal')" id="nav-cal">
      <span class="nav-emoji">🗓️</span>달력
    </button>
    <button class="nav-btn" onclick="showPage('events')" id="nav-events">
      <span class="nav-emoji">⭐</span>중요한 일
    </button>
    <button class="nav-btn" onclick="showPage('stats')" id="nav-stats">
      <span class="nav-emoji">📊</span>통계
    </button>
    <button class="nav-btn" onclick="showPage('settings')" id="nav-settings">
      <span class="nav-emoji">⚙️</span>설정
    </button>
  </nav>

  <!-- CALENDAR PAGE -->
  <div id="page-cal">
    <div class="cal-header">
      <button class="cal-nav-btn" onclick="moveMonth(-1)" title="이전 달">&#8249;</button>
      <h2 id="cal-title"></h2>
      <button class="cal-nav-btn" onclick="moveMonth(1)" title="다음 달">&#8250;</button>
    </div>
    <div class="cal-weekdays">
      <div class="cal-wd" style="color:#f87171">일</div>
      <div class="cal-wd">월</div><div class="cal-wd">화</div><div class="cal-wd">수</div>
      <div class="cal-wd">목</div><div class="cal-wd">금</div>
      <div class="cal-wd" style="color:#60a5fa">토</div>
    </div>
    <div class="cal-days" id="cal-days"></div>
    <div class="event-strip" id="event-strip"></div>
    <div id="day-detail-area"></div>
  </div>

  <!-- EVENTS PAGE -->
  <div id="page-events" style="display:none">
    <div class="event-form">
      <div class="section-label">⭐ 중요한 일 추가</div>
      <input class="ev-input" id="ev-emoji-in" placeholder="이모티콘 (예: 🎂)" style="width:80px;display:inline-block;margin-right:8px">
      <input class="ev-input" id="ev-title-in" placeholder="제목" style="width:calc(100% - 96px);display:inline-block">
      <input class="ev-input" id="ev-date-in" type="date">
      <button class="ev-add-btn" onclick="addEvent()">추가</button>
      <div style="clear:both"></div>
    </div>
    <div id="ev-list"></div>
  </div>

  <!-- STATS PAGE -->
  <div id="page-stats" style="display:none">
    <div class="stats-tabs">
      <button class="stats-tab active" onclick="setStatsTab('week')" id="stab-week">주간</button>
      <button class="stats-tab" onclick="setStatsTab('month')" id="stab-month">월간</button>
    </div>
    <div id="stats-content"></div>
  </div>

  <!-- SETTINGS PAGE -->
  <div id="page-settings" style="display:none">
    <div class="day-detail">
      <div class="section-label">✏️ 앱 이름 설정</div>
      <div style="display:flex;gap:8px;align-items:center;margin-bottom:16px">
        <input id="name-input" placeholder="이름 입력 (예: 다현)" style="flex:1;border:1.5px solid #e9d5ff;border-radius:8px;padding:8px 12px;font-size:14px;outline:none;font-family:inherit">
        <button onclick="saveName()" style="background:#9333ea;color:#fff;border:none;border-radius:8px;padding:8px 14px;font-size:13px;cursor:pointer">저장</button>
      </div>
      <div class="section-label">✅ 매일 할 일 관리</div>
      <div id="settings-tasks"></div>
      <div class="add-task" style="margin-top:10px">
        <input id="new-task-input" placeholder="새 할 일 추가">
        <button onclick="addTask()">추가</button>
      </div>
    </div>
  </div>
</div>

<script>
const STORAGE_KEY='daily_tracker_v3';
let state={days:{},tasks:[],events:[],currentYear:new Date().getFullYear(),currentMonth:new Date().getMonth(),selectedDate:null};

function save(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state))}catch(e){}}
function load(){try{const d=localStorage.getItem(STORAGE_KEY);if(d)state={...state,...JSON.parse(d)}}catch(e){}}

load();
if(!state.tasks.length) state.tasks=['운동','모닝페이지','저녁 후 금식','릴스 올리기'];
if(!state.events) state.events=[];

const today=new Date();
const todayStr=fmt(today);

function fmt(d){return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function dateStr(y,m,d){return`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`}

function showPage(p){
  ['cal','events','stats','settings'].forEach(x=>{
    document.getElementById('page-'+x).style.display=x===p?'block':'none';
    document.getElementById('nav-'+x).classList.toggle('active',x===p);
  });
  if(p==='stats')renderStats();
  if(p==='events')renderEvents();
  if(p==='settings')renderSettings();
}

function updateAppTitle(){
  const name=state.userName||'';
  document.getElementById('app-title').textContent=name?`${name} 하루 기록`:'하루 기록';
}
function saveName(){
  const v=document.getElementById('name-input').value.trim();
  state.userName=v;
  save();updateAppTitle();
  const btn=document.querySelector('#page-settings button[onclick="saveName()"]');
  if(btn){const orig=btn.textContent;btn.textContent='✅';setTimeout(()=>{btn.textContent=orig},1500);}
}
function focusNameEdit(){showPage('settings');}
function moveYear(d){
  state.currentYear+=d;
  state.selectedDate=null;
  renderCal();
}
function moveMonth(d){
  state.currentMonth+=d;
  if(state.currentMonth>11){state.currentMonth=0;state.currentYear++}
  if(state.currentMonth<0){state.currentMonth=11;state.currentYear--}
  state.selectedDate=null;
  renderCal();
}

function renderCal(){
  const y=state.currentYear,m=state.currentMonth;
  document.getElementById('cal-title').textContent=`${y}년 ${m+1}월`;
  const first=new Date(y,m,1).getDay();
  const last=new Date(y,m+1,0).getDate();
  const prevLast=new Date(y,m,0).getDate();
  let html='';
  for(let i=0;i<first;i++){const d=prevLast-first+1+i;html+=dayBtn(dateStr(y,m-1,d),d,true);}
  for(let d=1;d<=last;d++){html+=dayBtn(dateStr(y,m,d),d,false);}
  const rem=42-(first+last);
  for(let i=1;i<=rem;i++){html+=dayBtn(dateStr(y,m+1,i),i,true);}
  document.getElementById('cal-days').innerHTML=html;
  renderEventStrip();
  if(state.selectedDate)renderDayDetail(state.selectedDate);
}

function dayBtn(ds,d,other){
  const day=state.days[ds]||{};
  const hasNote=day.comment||(day.checks&&Object.keys(day.checks).length);
  const score=getDayScore(ds);
  const isToday=ds===todayStr;
  const isSel=ds===state.selectedDate;
  let cls='cal-day';
  if(other)cls+=' other-month';
  if(isToday)cls+=' today';
  if(isSel)cls+=' selected';
  if(hasNote)cls+=' has-note';
  if(score>=0)cls+=' has-score';
  const sc=score>=0?scoreColor(score):'';
  const dotStyle=score>=0?`background:${sc};display:block`:'display:none';
  return`<button class="${cls}" onclick="selectDay('${ds}')"><span>${d}</span><span class="score-dot" style="${dotStyle}"></span></button>`;
}

function scoreColor(s){
  if(s>=0.8)return'#34d399';
  if(s>=0.5)return'#fbbf24';
  return'#fb7185';
}

function getDayScore(ds){
  const day=state.days[ds];
  if(!day||!day.checks||!state.tasks.length)return -1;
  let total=0,filled=0;
  state.tasks.forEach(t=>{
    const v=day.checks&&day.checks[t];
    if(v){filled++;if(v==='o')total+=1;else if(v==='t')total+=0.5;}
  });
  if(!filled)return -1;
  return total/state.tasks.length;
}

function selectDay(ds){
  state.selectedDate=ds;
  renderCal();
  setTimeout(()=>{const el=document.getElementById('day-detail-area');if(el)el.scrollIntoView({behavior:'smooth',block:'nearest'});},50);
}

function renderEventStrip(){
  const y=state.currentYear,m=state.currentMonth;
  const evs=(state.events||[]).filter(e=>{const d=new Date(e.date);return d.getFullYear()===y&&d.getMonth()===m;}).sort((a,b)=>a.date.localeCompare(b.date));
  const strip=document.getElementById('event-strip');
  strip.innerHTML=evs.map(e=>`<div class="event-chip" onclick="selectDay('${e.date}')">${e.emoji||'📌'} ${e.title} <span class="ev-date">${e.date.slice(8)}일</span></div>`).join('');
}

function renderDayDetail(ds){
  const area=document.getElementById('day-detail-area');
  const day=state.days[ds]||{};
  const [y,m,d]=ds.split('-');
  const ev=(state.events||[]).filter(e=>e.date===ds);
  let evHtml=ev.length?`<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px">${ev.map(e=>`<span style="background:#fdf4ff;border:1px solid #e9d5ff;border-radius:20px;padding:3px 10px;font-size:12px;color:#9333ea">${e.emoji||'📌'} ${e.title}</span>`).join('')}</div>`:'';
  let tasksHtml=state.tasks.map(t=>{
    const v=(day.checks&&day.checks[t])||'';
    return`<div class="check-item">
      <span class="check-name">${t}</span>
      <div class="check-btns">
        <button class="check-btn o${v==='o'?' active':''}" onclick="setCheck('${ds}','${t}','o')" title="완료">🔴</button>
        <button class="check-btn t${v==='t'?' active':''}" onclick="setCheck('${ds}','${t}','t')" title="절반">⭕</button>
        <button class="check-btn x${v==='x'?' active':''}" onclick="setCheck('${ds}','${t}','x')" title="못함">❌</button>
      </div>
    </div>`;
  }).join('');
  area.innerHTML=`<div class="day-detail">
    <h3>📅 ${y}년 ${parseInt(m)}월 ${parseInt(d)}일</h3>
    ${evHtml}
    <div class="section-label">✏️ 하루 한 줄</div>
    <textarea class="comment-box" id="comment-${ds}" placeholder="오늘 하루를 한 줄로 표현해보세요 ✨">${day.comment||''}</textarea>
    <div class="section-label">✅ 오늘의 체크</div>
    ${tasksHtml||'<div class="empty">설정에서 할 일을 추가해주세요</div>'}
    <button class="save-btn" onclick="saveDay('${ds}')">💾 저장하기</button>
    <div class="save-ok" id="save-ok-${ds}"></div>
  </div>`;
}

function setCheck(ds,task,val){
  if(!state.days[ds])state.days[ds]={};
  if(!state.days[ds].checks)state.days[ds].checks={};
  state.days[ds].checks[task]=state.days[ds].checks[task]===val?'':val;
  save();renderDayDetail(ds);
}

function saveDay(ds){
  if(!state.days[ds])state.days[ds]={};
  state.days[ds].comment=document.getElementById('comment-'+ds).value;
  save();renderCal();
  const ok=document.getElementById('save-ok-'+ds);
  ok.textContent='✅ 저장됐어요!';
  setTimeout(()=>{ok.textContent=''},2000);
}

function addEvent(){
  const emoji=document.getElementById('ev-emoji-in').value.trim()||'📌';
  const title=document.getElementById('ev-title-in').value.trim();
  const date=document.getElementById('ev-date-in').value;
  if(!title||!date)return;
  if(!state.events)state.events=[];
  state.events.push({id:Date.now(),emoji,title,date});
  save();
  document.getElementById('ev-title-in').value='';
  document.getElementById('ev-emoji-in').value='';
  document.getElementById('ev-date-in').value='';
  renderEvents();
}

function renderEvents(){
  const sorted=[...(state.events||[])].sort((a,b)=>a.date.localeCompare(b.date));
  const el=document.getElementById('ev-list');
  if(!sorted.length){el.innerHTML='<div class="empty">아직 중요한 일이 없어요 🌸</div>';return}
  el.innerHTML=sorted.map(e=>`<div class="ev-list-item">
    <span class="ev-emoji">${e.emoji||'📌'}</span>
    <div class="ev-info"><div class="ev-title">${e.title}</div><div class="ev-date-txt">${e.date}</div></div>
    <button class="ev-del" onclick="delEvent(${e.id})"><i class="ti ti-trash"></i></button>
  </div>`).join('');
}

function delEvent(id){state.events=state.events.filter(e=>e.id!==id);save();renderEvents();}

let statsTab='week';
function setStatsTab(t){
  statsTab=t;
  document.getElementById('stab-week').classList.toggle('active',t==='week');
  document.getElementById('stab-month').classList.toggle('active',t==='month');
  renderStats();
}

function renderStats(){
  const el=document.getElementById('stats-content');
  const now=new Date();

  if(statsTab==='week'){
    // 월화수목금토일 순서 (월요일 기준)
    const dates=[];
    const dayLabels=['월','화','수','목','금','토','일'];
    // 이번 주 월요일 찾기
    const dow=now.getDay(); // 0=일,1=월...6=토
    const mondayOffset=dow===0?-6:1-dow;
    for(let i=0;i<7;i++){
      const d=new Date(now);
      d.setDate(d.getDate()+mondayOffset+i);
      dates.push(fmt(d));
    }
    const scores=dates.map(d=>getDayScore(d));
    const maxScore=Math.max(...scores.filter(s=>s>=0),0.01);

    const bars=dates.map((d,i)=>{
      const s=scores[i];
      const pct=s<0?0:Math.round(s*100);
      const isToday=d===todayStr;
      const fillH=s<0?0:Math.max(4,Math.round((s/1)*130));
      return`<div class="week-bar-col${isToday?' week-bar-today':''}">
        <div class="week-bar-pct">${s<0?'':pct+'%'}</div>
        <div class="week-bar-track">
          <div class="week-bar-fill" style="height:${fillH}px"></div>
        </div>
        <div class="week-bar-day">${dayLabels[i]}</div>
      </div>`;
    }).join('');

    const taskScoresWeek=state.tasks.map(t=>{
      let pts=0;
      dates.forEach(d=>{
        const day=state.days[d];
        const v=day&&day.checks&&day.checks[t];
        if(v==='o')pts+=1;
        else if(v==='t')pts+=0.5;
      });
      return{name:t,pts};
    });
    const taskWeekHtml=taskScoresWeek.map(ts=>`<div class="task-score-item">
      <span class="ts-name">${ts.name}</span>
      <span class="ts-score">${ts.pts%1===0?ts.pts:ts.pts.toFixed(1)}</span>
      <span class="ts-max"> / 7점</span>
    </div>`).join('');

    el.innerHTML=`<div class="chart-wrap">
      <div class="chart-title">📊 이번 주 달성률</div>
      <div class="week-bars">${bars}</div>
    </div>
    <div class="chart-wrap">
      <div class="chart-title">🏅 항목별 이번 주 총점</div>
      ${taskWeekHtml||'<div class="empty">할 일을 설정해주세요</div>'}
    </div>`;

  } else {
    // 월간
    const y=now.getFullYear(),m=now.getMonth();
    const totalDays=new Date(y,m+1,0).getDate();
    const dates=[];
    for(let d=1;d<=totalDays;d++)dates.push(dateStr(y,m,d));
    const scores=dates.map(d=>getDayScore(d));

    const barHtml=dates.map((d,i)=>{
      const s=scores[i];
      const pct=s<0?0:Math.round(s*100);
      return`<div class="bar-row">
        <span class="bar-label">${i+1}일</span>
        <div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div>
        <span class="bar-score">${s<0?'-':pct+'%'}</span>
      </div>`;
    }).join('');

    // 항목별 총점
    const taskScores=state.tasks.map(t=>{
      let pts=0;
      dates.forEach(d=>{
        const day=state.days[d];
        const v=day&&day.checks&&day.checks[t];
        if(v==='o')pts+=1;
        else if(v==='t')pts+=0.5;
      });
      return{name:t,pts};
    });

    const taskHtml=taskScores.map(ts=>`<div class="task-score-item">
      <span class="ts-name">${ts.name}</span>
      <span class="ts-score">${ts.pts % 1 === 0 ? ts.pts : ts.pts.toFixed(1)}</span>
      <span class="ts-max"> / ${totalDays}점</span>
    </div>`).join('');

    el.innerHTML=`<div class="chart-wrap">
      <div class="chart-title">📅 이번 달 일별 달성률</div>
      <div style="max-height:260px;overflow-y:auto">${barHtml}</div>
    </div>
    <div class="chart-wrap">
      <div class="chart-title">🏅 항목별 이달 총점</div>
      ${taskHtml||'<div class="empty">할 일을 설정해주세요</div>'}
    </div>`;
  }
}

function renderSettings(){
  const el=document.getElementById('settings-tasks');
  const ni=document.getElementById('name-input');
  if(ni)ni.value=state.userName||'';
  if(!state.tasks.length){el.innerHTML='<div class="empty">할 일이 없어요</div>';return}
  el.innerHTML=state.tasks.map((t,i)=>`<div class="check-item">
    <span class="check-name">${t}</span>
    <button onclick="removeTask(${i})" style="border:none;background:transparent;cursor:pointer;color:#fca5a5;font-size:18px"><i class="ti ti-trash"></i></button>
  </div>`).join('');
}

function addTask(){
  const inp=document.getElementById('new-task-input');
  const v=inp.value.trim();
  if(!v)return;
  state.tasks.push(v);
  inp.value='';
  save();renderSettings();
}

function removeTask(i){state.tasks.splice(i,1);save();renderSettings();}

document.getElementById('new-task-input').addEventListener('keydown',e=>{if(e.key==='Enter')addTask()});

renderCal();
selectDay(todayStr);
updateAppTitle();
</script>
</body>
</html>
